<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UPGRADE · жидкий асфальт — эскиз эффекта</title>
<style>
:root{
  --bg:#0a0a0c;
  --granat:#b3122b;
  --granat-hi:#e6203a;
  --ink:#f2f2f0;
  --muted:#8d939b;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Switzer',system-ui,sans-serif;overflow:hidden}
.canvas-wrap{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%;cursor:crosshair}
.cap{
  position:fixed;left:24px;bottom:20px;z-index:2;
  color:var(--muted);font-size:.8rem;letter-spacing:.01em;pointer-events:none;
  text-shadow:0 1px 8px rgba(0,0,0,.8);
}
.cap b{color:var(--ink);font-weight:500}
.brand{
  position:fixed;right:24px;bottom:20px;z-index:2;pointer-events:none;
  color:var(--muted);font-size:.78rem;text-shadow:0 1px 8px rgba(0,0,0,.8);
}
.brand em{font-style:normal;color:var(--granat-hi)}
</style>
</head>
<body>
<div class="canvas-wrap"><canvas id="cv"></canvas></div>
<p class="cap"><b>Води мышкой</b> — дым клубится и завивается. <b>Клик</b> — хлопок и круг по луже.</p>
<p class="brand"><em>UPGRADE</em> · эскиз эффекта · фирстил гранат</p>
<script>
(function(){
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var img = new Image();
  img.src = '../фотовидео/Sports_running_engine_2K_20261019180542.jpg';

  var W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);
  var SLICE = 14;               // ширина ломтика, px
  var nCols = 0;
  var mouse = { x: -9999, y: -9999, px: -9999, py: -9999, in: false };
  var ripples = [];             // {x, t0}
  var mvx = 0, mvy = 0;         // сглаженная скорость мыши
  var t0 = performance.now();

  function resize(){
    var dpr = DPR;
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    nCols = Math.ceil(W / SLICE);
  }
  window.addEventListener('resize', resize);
  resize();

  window.addEventListener('mousemove', function(e){
    mouse.x = e.clientX; mouse.y = e.clientY; mouse.in = true;
  });
  window.addEventListener('mouseleave', function(){ mouse.in = false; mouse.x = -9999; });
  window.addEventListener('mouseout', function(){ mouse.in = false; mouse.x = -9999; });
  window.addEventListener('click', function(e){
    ripples.push({ x: e.clientX, t0: performance.now() });
    if (ripples.length > 6) ripples.shift();
    // клик — хлопок: дым разлетается от точки
    for (var i = 0; i < puffs.length; i++){
      var pf = puffs[i];
      var dx = pf.x - e.clientX, dy = pf.y - (e.clientY + 60);
      var d = Math.sqrt(dx * dx + dy * dy) || 1;
      var push = 1400 / (d + 140);
      pf.vx += dx / d * push * 3;
      pf.vy += dy / d * push * 3 - push;
    }
  });
  window.addEventListener('touchmove', function(e){
    if (e.touches[0]){ mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; mouse.in = true; }
  }, {passive:true});
  window.addEventListener('touchstart', function(e){
    if (e.touches[0]) ripples.push({ x: e.touches[0].clientX, t0: performance.now() });
  }, {passive:true});

  // --- дым из выхлопной: стелющиеся клубы поверх волны ---
  var puffSprite = null;
  var puffs = [];
  function makePuff(){
    var s = document.createElement('canvas');
    var size = 256; s.width = s.height = size;
    var g = s.getContext('2d');
    var grad = g.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
    grad.addColorStop(0,   'rgba(216,220,225,0.85)');
    grad.addColorStop(0.45,'rgba(198,205,212,0.38)');
    grad.addColorStop(1,   'rgba(186,196,205,0)');
    g.fillStyle = grad;
    g.fillRect(0, 0, size, size);
    return s;
  }
  function spawnPuff(initial){
    return {
      x: initial ? Math.random() * (W + 400) - 200 : -260,
      y: H * 0.35 + Math.random() * H * 0.55,
      r: 200 + Math.random() * 320,
      bvx: 3 + Math.random() * 4,
      bvy: -(0.5 + Math.random() * 1.4),
      vx: 0, vy: 0,
      a: 0.10 + Math.random() * 0.13,
      ph: Math.random() * Math.PI * 2,
      grow: 8 + Math.random() * 12,
      rot: Math.random() * Math.PI * 2
    };
  }

  var lastT = 0;
  function frame(now){
    var t = (now - t0) / 1000;
    var dt = Math.min((now - lastT) / 1000, 0.05) || 0.016;
    lastT = now;
    // геометрия cover
    var iw = img.width, ih = img.height;
    if (!iw || !W){ requestAnimationFrame(frame); return; }
    var scale = Math.max(W / iw, H / ih);
    var visW = W / scale, visH = H / scale;
    var sx0 = (iw - visW) / 2, sy0 = (ih - visH) / 2;

    ctx.clearRect(0, 0, W, H);

    // затухающие круги от кликов
    for (var r = ripples.length - 1; r >= 0; r--){
      if (t * 1 - (ripples[r].t0 - t0) / 1000 > 2.6) ripples.splice(r, 1);
    }

    var sliceSrc = visW / nCols;

    for (var i = 0; i < nCols; i++){
      var colX = i * SLICE;
      var cx = colX + SLICE / 2;

      // фоновое «дыхание» воды
      var dy = Math.sin(cx * 0.012 + t * 0.9) * 2.2
             + Math.sin(cx * 0.005 - t * 0.5) * 1.6;

      var stretch = 1;

      // бугор под курсором + расходящиеся волны
      if (mouse.in){
        var dm = cx - mouse.x;
        var g = Math.exp(-(dm * dm) / (2 * 130 * 130));
        var dist = dm / 46 + t * 5.2;
        dy += Math.sin(dist) * 10 * g;
        stretch += g * 0.16;
      }

      // круги от кликов — бегущая волна по горизонтали
      for (var k = 0; k < ripples.length; k++){
        var rp = ripples[k];
        var age = (now - rp.t0) / 1000;
        var dr = cx - rp.x;
        var front = age * 340;                  // скорость круга, px/с
        var band = dr - front;
        var env = Math.exp(-Math.abs(band) / 90) * Math.max(0, 1 - age / 2.6);
        dy += Math.sin(band * 0.05) * 16 * env;
        stretch += env * 0.1;
      }

      var extra = (stretch - 1);
      var drawH = H * stretch;
      var drawY = dy - (H * extra) / 2;

      ctx.drawImage(
        img,
        sx0 + i * sliceSrc, sy0, sliceSrc + 0.5, visH,
        colX, drawY - H * 0.06, SLICE + 0.7, drawH + H * 0.12
      );
    }

    // --- дым, оживающий от мыши ---
    if (!puffSprite) puffSprite = makePuff();
    while (puffs.length < 18) puffs.push(spawnPuff(puffs.length < 11));

    // скорость мыши (сглаженная)
    if (mouse.in && mouse.px > -9000 && dt > 0){
      var ivx = Math.max(-4000, Math.min(4000, (mouse.x - mouse.px) / dt));
      var ivy = Math.max(-4000, Math.min(4000, (mouse.y - mouse.py) / dt));
      mvx += (ivx - mvx) * 0.35;
      mvy += (ivy - mvy) * 0.35;
    } else { mvx *= 0.9; mvy *= 0.9; }
    mouse.px = mouse.x; mouse.py = mouse.y;

    ctx.globalCompositeOperation = 'screen';
    var mspeed = Math.sqrt(mvx * mvx + mvy * mvy);
    for (var p = 0; p < puffs.length; p++){
      var pf = puffs[p];

      // влияние курсора: толчок по движению + завихрение
      var ddx = pf.x - mouse.x, ddy = pf.y - mouse.y;
      var g = mouse.in ? Math.exp(-(ddx * ddx + ddy * ddy) / (2 * 160 * 160)) : 0;
      var swirl = Math.sin(t * 2.8 + pf.ph);
      pf.vx += (mvx * g * 2.4 + (-mvy * swirl * 0.9) * g) * dt;
      pf.vy += (mvy * g * 2.4 + ( mvx * swirl * 0.9) * g) * dt;
      // релаксация к фоновому дрейфу
      pf.vx += (pf.bvx - pf.vx) * dt * 1.2;
      pf.vy += (pf.bvy - pf.vy) * dt * 1.2;

      pf.x += pf.vx * dt;
      pf.y += pf.vy * dt;
      pf.r += pf.grow * dt;
      pf.rot += (Math.sin(t * 1.7 + pf.ph) * 0.15 + mvx * g * 0.00004) * dt;

      // прокрутка краёв
      if (pf.x - pf.r > W + 120){ pf.x = -pf.r * 0.4; pf.y = H * 0.35 + Math.random() * H * 0.5; pf.r = 200 + Math.random() * 320; pf.vx = pf.vy = 0; }
      if (pf.y + pf.r < -80) pf.y = H + pf.r * 0.5;
      if (pf.y - pf.r > H + 120) pf.y = -pf.r * 0.3;
      var pulse = 0.78 + 0.22 * Math.sin(t * 0.7 + pf.ph);
      var billow = g * Math.min(mspeed * 0.00016, 0.5);   // от резкого движения дым густеет
      ctx.globalAlpha = Math.min(pf.a * pulse + billow, 0.55);
      var rr = pf.r * (1 + billow * 0.9);
      ctx.save();
      ctx.translate(pf.x, pf.y);
      ctx.rotate(pf.rot);
      ctx.scale(rr / 128, rr * 0.62 / 128);
      ctx.drawImage(puffSprite, -128, -128);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    requestAnimationFrame(frame);
  }

  img.decode ? img.decode().then(function(){ requestAnimationFrame(frame); }).catch(function(){ requestAnimationFrame(frame); })
             : (img.onload = function(){ requestAnimationFrame(frame); });
})();
</script>
</body>
</html>
